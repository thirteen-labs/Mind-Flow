name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools". The legacy "tools" package is no
          # longer published in Google's SDK repository, so the action's
          # `sdkmanager tools` call exits 1 with "Failed to find package 'tools'".
          # AGP auto-installs the remaining platform/build-tools/NDK components.
          packages: 'platform-tools'
          # Silences the full Google SDK license text that otherwise floods logs.
          log-accepted-android-sdk-licenses: false

      - run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mindflow-release-apk
          path: android/app/build/outputs/apk/release/*.apk
